name: Apply scoped Claude Worker assertion patch

on:
  push:
    branches:
      - chore/claude-directory-safety
    paths:
      - .github/workflows/claude-worker-assertion-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/claude-directory-safety

      - name: Verify baseline and patch two assertions
        run: |
          test "$(git hash-object tests/worker/orchestration.test.ts)" = "4ff95f8d9592338f40b5d65986982b3a473a4687"
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/worker/orchestration.test.ts')
          text = path.read_text()
          replacements = [
              (
                  "expect(tools['sites.add'].annotations).toMatchObject({\n        readOnlyHint: false,\n        destructiveHint: false,\n        idempotentHint: true,\n      });",
                  "expect(tools['sites.add'].annotations).toMatchObject({\n        readOnlyHint: false,\n        destructiveHint: true,\n        idempotentHint: true,\n      });",
              ),
              (
                  "expect(tools['indexing.request'].annotations).toMatchObject({\n        readOnlyHint: false,\n        destructiveHint: false,\n        idempotentHint: false,\n      });",
                  "expect(tools['indexing.request'].annotations).toMatchObject({\n        readOnlyHint: false,\n        destructiveHint: true,\n        idempotentHint: false,\n      });",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact assertion block, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check -- tests/worker/orchestration.test.ts
          git diff --stat -- tests/worker/orchestration.test.ts

      - name: Commit assertion-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/worker/orchestration.test.ts
          git commit -m "test: align Worker mutation safety assertions"
          git push origin HEAD:chore/claude-directory-safety
