name: Publish to MCP Registry

on:
  release:
    types: [published]
  pull_request:
    paths:
      - server.json
      - package.json
      - .github/workflows/publish-mcp.yml
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  MCP_PUBLISHER_LINUX_ARM64_SHA256: 8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate published install paths
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          if ! jq -e --arg pkg "$PKG_NAME" --arg version "$PKG_VERSION" --arg mcpName "$MCP_NAME" '
            ([.. | strings | select(contains("REPLACE-ME"))] | length == 0) and
            (.name == $mcpName) and
            any(.remotes[]?; .type == "streamable-http" and .url == "https://mcp-gsc.digestseo.com/mcp") and
            any(
              .remotes[]?;
              .type == "streamable-http" and
              .url == "https://{mcp_gsc_worker_domain}/mcp" and
              (.variables.mcp_gsc_worker_domain | type == "object") and
              .variables.mcp_gsc_worker_domain.isRequired == true
            ) and
            any(
              .packages[]?;
              .registryType == "npm" and
              .identifier == $pkg and
              .version == $version and
              .transport.type == "stdio"
            )
          ' server.json > /dev/null; then
            echo "::error file=server.json::server.json must expose the hosted endpoint, self-host template, and npm package matching package.json."
            exit 1
          fi

      - name: Install verified mcp-publisher
        uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish to registry
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install verified mcp-publisher
        uses: ./.github/actions/install-mcp-publisher
      - name: Log in to the registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish server.json
