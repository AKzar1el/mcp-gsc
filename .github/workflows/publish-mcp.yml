name: Publish to MCP Registry

on:
  release:
    types: [published]
  pull_request:
    paths:
      - server.json
      - package.json
      - .github/workflows/publish-mcp.yml
  push:
    branches:
      - main
    paths:
      - server.json

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
  MCP_PUBLISHER_LINUX_ARM64_SHA256: 8dd75a6cf6845688b5d4e46df58d3ca26d5c8d233bb0626606e1db82c5e883e4

jobs:
  validate:
    name: Validate server.json
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a new Registry version for server.json changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" -- server.json; then
            exit 0
          fi

          BASE_VERSION=$(git show "$BASE_SHA:server.json" | jq -r '.version')
          CURRENT_VERSION=$(jq -r '.version' server.json)
          if [ "$CURRENT_VERSION" = "$BASE_VERSION" ]; then
            echo "::error file=server.json::server.json changed but Registry version stayed at $CURRENT_VERSION. Bump the independent Registry document version before merge."
            exit 1
          fi

      - name: Validate published install paths
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          if ! jq -e --arg pkg "$PKG_NAME" --arg version "$PKG_VERSION" --arg mcpName "$MCP_NAME" '
            ([.. | strings | select(contains("REPLACE-ME"))] | length == 0) and
            (.name == $mcpName) and
            all(.remotes[]?; (.url | contains("{") | not) and (.url | contains("}") | not)) and
            any(
              .packages[]?;
              .registryType == "npm" and
              .identifier == $pkg and
              .version == $version and
              .runtimeHint == "npx" and
              .transport.type == "streamable-http" and
              .transport.url == "http://127.0.0.1:{PORT}/mcp" and
              any(.environmentVariables[]?; .name == "PORT" and .default == "8080") and
              any(.environmentVariables[]?; .name == "GOOGLE_CLIENT_ID" and .isRequired == true) and
              any(.environmentVariables[]?; .name == "GOOGLE_CLIENT_SECRET" and .isRequired == true and .isSecret == true) and
              any(.environmentVariables[]?; .name == "TOKEN_ENCRYPTION_KEY" and .isRequired == true and .isSecret == true)
            )
          ' server.json > /dev/null; then
            echo "::error file=server.json::server.json must expose the npm package with its actual local Streamable HTTP launcher contract, and any optional remote URLs must be concrete."
            exit 1
          fi

      - name: Install verified mcp-publisher
        uses: ./.github/actions/install-mcp-publisher
      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate server.json

  publish:
    name: Publish to registry
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Main may advance before a new npm version is public. Registry metadata-only
      # updates still publish immediately when their referenced package exists.
      - name: Require publicly available npm package
        id: npm_ready
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(jq -r '.packages[] | select(.registryType == "npm") | .identifier' server.json | head -n 1)
          PACKAGE_VERSION=$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json | head -n 1)
          if [[ -z "$PACKAGE_NAME" || -z "$PACKAGE_VERSION" || "$PACKAGE_NAME" == null || "$PACKAGE_VERSION" == null ]]; then
            echo "::error file=server.json::Missing npm package name/version"
            exit 1
          fi
          ENCODED_NAME=$(node -p 'encodeURIComponent(process.argv[1])' "$PACKAGE_NAME")
          URL="https://registry.npmjs.org/$ENCODED_NAME/$PACKAGE_VERSION"
          max_attempts=1
          if [[ "$EVENT_NAME" == release ]]; then
            max_attempts=24
          fi

          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            status=$(curl --silent --show-error --max-time 15 --output "$RUNNER_TEMP/npm-package-version.json" --write-out '%{http_code}' "$URL") || status=000
            if [[ "$status" == 200 ]]; then
              if ! jq -e --arg name "$PACKAGE_NAME" --arg version "$PACKAGE_VERSION" '.name == $name and .version == $version' "$RUNNER_TEMP/npm-package-version.json" >/dev/null; then
                echo "::error::npm returned mismatching package metadata"
                exit 1
              fi
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              echo "npm $PACKAGE_NAME@$PACKAGE_VERSION is publicly available"
              exit 0
            fi

            if [[ "$EVENT_NAME" == push && "$status" == 404 ]]; then
              echo "npm $PACKAGE_NAME@$PACKAGE_VERSION is not public yet; defer Registry publication to the release event"
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$status" != 404 && "$status" != 000 && "$status" != 429 && ! "$status" =~ ^5[0-9][0-9]$ ]]; then
              echo "::error::Unexpected npm registry HTTP status $status"
              exit 1
            fi
            if ((attempt < max_attempts)); then
              echo "npm $PACKAGE_NAME@$PACKAGE_VERSION not ready (HTTP $status; attempt $attempt/$max_attempts)"
              sleep 10
            fi
          done
          echo "::error::npm $PACKAGE_NAME@$PACKAGE_VERSION was not public after $max_attempts checks; rerun this workflow only after npm publication is verified"
          exit 1
      - name: Install verified mcp-publisher
        if: steps.npm_ready.outputs.ready == 'true'
        uses: ./.github/actions/install-mcp-publisher
      - name: Log in to the registry (GitHub OIDC)
        if: steps.npm_ready.outputs.ready == 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish
        if: steps.npm_ready.outputs.ready == 'true'
        run: ./mcp-publisher publish server.json
