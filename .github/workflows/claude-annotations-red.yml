name: Claude annotation regression

on:
  push:
    branches:
      - chore/claude-directory-safety
    paths:
      - .github/workflows/claude-annotations-red.yml

permissions:
  contents: read

jobs:
  annotations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:annotations
