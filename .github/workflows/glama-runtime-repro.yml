name: Glama runtime reproduction

on:
  push:
    branches: [fix/glama-wrangler-launcher]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - run: pnpm install
      - name: Start launcher and probe ping
        env:
          PORT: 8788
          GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-secret
          TOKEN_ENCRYPTION_KEY: f0e1d2c3b4a5968778695a4b3c2d1e0f
        run: |
          set -eu
          node scripts/glama-start.mjs > /tmp/glama.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          i=0
          while [ "$i" -lt 20 ]; do
            if curl -fsS http://127.0.0.1:8788/ping >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/glama.log
              exit 1
            fi
            sleep 1
            i=$((i + 1))
          done
          cat /tmp/glama.log
          exit 1
